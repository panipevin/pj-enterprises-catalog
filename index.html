const SC={products:r=>r.id,users:r=>r.role+':'+r.u,quotes:r=>r.id,bills:r=>r.id,sups:r=>r.id,pays:r=>r.id,spays:r=>r.id,cols:r=>r.id};
let tok=localStorage.getItem(K+'_t')||'',base=null,ver=-1,busyS=false,again=false,needR=false,syTxt=CFG.url?'⏳ Syncing…':'💾 Local only';var qt=null;
try{base=JSON.parse(localStorage.getItem(K+'_base'))}catch(e){}
const hs=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h},save0=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const snap=()=>{const b={};for(const c in SC){b[c]={};(S[c]||[]).forEach(r=>b[c][SC[c](r)]=hs(JSON.stringify(r)))}return b},saveBase=()=>{try{localStorage.setItem(K+'_base',JSON.stringify(base))}catch(e){}};
function dif(b){const ops=[],t=Date.now();for(const c in SC){const cur={};(S[c]||[]).forEach(r=>cur[SC[c](r)]=r);const o=b[c]||{};for(const k in cur)if(o[k]!==hs(JSON.stringify(cur[k])))ops.push({c,key:k,rec:cur[k],t});for(const k in o)if(!(k in cur))ops.push({c,key:k,rec:null,t})}return ops}
function putOps(ops){ops.forEach(o=>{const a=S[o.c]=S[o.c]||[],i=a.findIndex(r=>SC[o.c](r)===o.key);if(o.rec===null){if(i>=0)a.splice(i,1)}else if(i>=0)a[i]=o.rec;else a.unshift(o.rec)})}
function setSy(t){syTxt=t;const e=$('#sy');if(e)e.textContent=t}
const idle=()=>!$('#rp')&&!$('#qm')&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));
function queueSync(){if(!CFG.url)return;clearTimeout(qt);qt=setTimeout(sync,700)}
async function call(b){const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);try{const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({t:tok,...b}),signal:c.signal}),j=await r.json();if(j.error){if(j.code==='auth')authLost();throw new Error(j.error)}return j}finally{clearTimeout(t)}}
function adopt(st){for(const c in SC)S[c]=st[c]||[];S.qn=Math.max(S.qn||0,st.qn||0);S.bn=Math.max(S.bn||0,st.bn||0);if(me&&!S.users.some(u=>u.u===me.id&&u.role===me.role)){me=null;sv()}}
const wipe=()=>{S=seed();base=null;ver=-1;cart=[];needSetup=false;try{localStorage.removeItem(K);localStorage.removeItem(K+'_base')}catch(e){}};
function authLost(){tok='';try{localStorage.removeItem(K+'_t')}catch(e){}wipe();me=null;sv();lbusy=false;err='Please sign in again';render()}
async function enter(r){tok=r.token;try{localStorage.setItem(K+'_t',tok)}catch(e){}wipe();me={role:r.user.role,id:r.user.u,name:r.user.name};sv();tab=me.role==='owner'?'dash':'catalog';lbusy=false;err='';await sync();render()}
function boot(){if(me&&!tok){me=null;sv()}if(!CFG.url){render();return}if(me&&tok){render();sync();return}needSetup=null;err='';render();call({a:'status'}).then(r=>{needSetup=!!r.needSetup;render()}).catch(e=>{err='Could not reach the server: '+e.message;render()})}
function redraw(){if(idle()){needR=false;render()}else needR=true}
async function sync(){if(!CFG.url||!tok||!me)return;if(busyS){again=true;return}busyS=true;setSy('⏳ Syncing…');
try{if(!base){const r=await call({a:'sync',since:-1,ops:[]});if(r.v>0&&Object.keys(SC).some(c=>(r.state[c]||[]).length)){adopt(r.state);ver=r.v;base=snap();saveBase();save0();redraw();setSy('✅ Synced');return}base={}}
const ops=dif(base),sent=snap(),r=await call({a:'sync',since:ver,ops,cnt:{qn:S.qn||0,bn:S.bn||0}});
if(r.state){const later=dif(sent);adopt(r.state);ver=r.v;base=snap();saveBase();putOps(later);if(later.length)again=true;save0();redraw()}else ver=r.v;
setSy('✅ Synced')}catch(e){setSy('⚠️ Offline · tap to retry')}finally{busyS=false;if(again){again=false;setTimeout(sync,300)}}}
if(CFG.url){setInterval(()=>{if(needR&&idle())redraw();if(!document.hidden)sync()},12000);addEventListener('focus',sync);addEventListener('online',sync)}
boot();
